[llm]
provider = "openai-compatible"
# 结构性预检示例：端口 9 是 discard 服务，即使漏掉 --no-llm-ping 也不可能有真实
# LLM 调用成功。
base_url = "http://127.0.0.1:9/v1"
model = "paper-grade-preflight-only"
# 本文件故意不声明任何凭据，preflight 会如实报 llm_api_key fail（退出码非 0）。
# SEC-01 下 env key 只在 effective endpoint 与可信来源同源时才释放，而上面的
# base_url 指向 discard 端口，所以在这里写 api_key_env 也永远解析不出 key。
# 正式 run 请改用成对的 base_url_env / api_key_env 形式，见
# examples/uci-iris-paper-grade-config.toml。

[literature]
provider = "online"
max_papers = 12
sources = ["semantic_scholar", "openalex", "arxiv", "crossref"]
timeout_seconds = 12
max_search_queries = 6
seed_papers = [
  "10.1177/0278364911406761 Sampling-based Algorithms for Optimal Motion Planning survey algorithm baseline method",
  "10.1109/MRA.2012.2205651 The Open Motion Planning Library OMPL benchmark dataset evaluation suite",
  "https://doi.org/10.1109/MRA.2022.3147415 recent robot manipulation review benchmark baseline 2022"
]

[ideation]
max_ideas = 5

[execution]
mode = "benchmark"
timeout_seconds = 300
allowed_commands = ["python3"]
repeats = 3
benchmark_manifest_paths = [
  "examples/rrt-2d-benchmark/manifest-candidate.json",
  "examples/rrt-2d-benchmark/manifest-baseline.json",
  "examples/rrt-2d-benchmark/manifest-ablation.json"
]

[paper]
target_venue = "workshop"
style = "concise"

[paper_grade]
enabled = true
min_literature_sources = 3
min_successful_literature_sources = 2
min_seed_papers = 3
min_doi_url_seed_papers = 3
min_curated_seed_roles = 3
min_benchmark_roles = 3
min_execution_repeats = 3

[human]
constraints = [
  "Treat examples/rrt-2d-benchmark as a structural paper-grade fixture only; replace it with an accepted external benchmark before formal paper claims."
]
success_criteria = [
  "Preflight paper-grade checks pass for online literature and DOI/URL seed coverage, while benchmark manifests remain a structural fixture until replaced by an external public benchmark."
]

[release]
code_repository_url = "https://github.com/example/research-agent-paper-grade-fixture"
code_license = "MIT"
code_version = "paper-grade-fixture"
data_repository_url = "https://github.com/example/research-agent-paper-grade-fixture/tree/main/examples/rrt-2d-benchmark"
data_access_statement = "The bundled fixture uses deterministic procedural scenes controlled by RESEARCH_AGENT_SEED and RESEARCH_AGENT_REPEAT_INDEX; replace with a public external benchmark for formal publication claims."
environment_url = "https://github.com/example/research-agent-paper-grade-fixture/blob/main/pyproject.toml"
release_notes = "Preflight scaffold only. Replace LLM credentials, repository URLs, and benchmark manifests before a real paper submission."
