[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-copilot"
version = "0.1.0"
description = "Research Copilot: 面向真实科研项目的诊断、假设与实验规划系统（证据约束、可证伪、可复现评测）。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Research Copilot" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
eval = ["pandas>=1.5"]  # .dta 数据集支持（DiscoveryBench 部分任务）

[project.scripts]
research-copilot = "research_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
